# Machine-readable cryptographic provenance lock for the sphragis acceptance
# gate (`cargo test --features preview-pq`).
#
# WHY: a prose provenance claim (a sentence naming a draft revision) can drift
# silently — nothing fails when the cited revision stops being current, or
# when the vendored vector bytes stop matching what the sentence claims. This
# file is the SSOT for what standard each construction is bound to, which
# vector proves it, and which dependency version that vector was verified
# against. `tests/provenance_lock.rs` executes every check below; a human or
# agent editing a `locked_version` or `source_sha256` field without also
# updating the corresponding test is the failure this file exists to catch.
#
# Do not hand-restate any of these facts in DECISION.md / README.md / llms.txt
# — point at this file instead.

[review_policy]
trigger = """
Any of the following requires re-deriving and re-vendoring the affected
vector(s) against the new source, updating this file's source_sha256 /
locked_version / revision fields, and confirming the corresponding test
(location per that vector's `executed_by` field, below) still asserts full
construction output (not just a shared secret) — before merge, not after:
  1. `cargo update` changes the resolved version of any crate listed under
     [[dependency]] below.
  2. The X-Wing draft (draft-connolly-cfrg-xwing-kem) publishes a revision
     whose Appendix G change log records a change to the Combiner or
     ExpandDecapsulationKey definitions (not every revision bump requires
     this — most are editorial; see the `notes` field on the x-wing
     [[standard]] entry for the last-verified stability window).
  3. X-Wing is adopted as an RFC (revision becomes immutable; update
     `revision` and `source_url` to the RFC, drop the draft-instability
     framing from `notes`).
"""
enforced_by = "tests/provenance_lock.rs — asserts every [[dependency]].locked_version equals the version actually resolved in Cargo.lock, and every vendored [[vector]].vendored_file's sha256 equals its recorded source_sha256."

# ---------------------------------------------------------------------------
# Standards. Each construction sphragis implements traces to exactly one of
# these. RFCs and the FIPS publication are immutable once published — citing
# a revision is a permanent, unambiguous binding. The X-Wing draft is NOT
# immutable: IETF drafts are replaced in place under the same base name each
# revision, which is the exact failure this lock exists to catch (see `notes`).
# ---------------------------------------------------------------------------

[[standard]]
id = "x-wing"
name = "X-Wing hybrid KEM (X25519 + ML-KEM-768)"
revision = "draft-connolly-cfrg-xwing-kem-10"
source_url = "https://www.ietf.org/archive/id/draft-connolly-cfrg-xwing-kem-10.txt"
active_as_of = "2026-03-02"
notes = """
Not an RFC yet — draft revisions mutate the same base name in place, so a
prose citation of one revision number silently goes stale as later revisions
publish (this is the defect this lock replaces). The Combiner and
ExpandDecapsulationKey byte-level definitions have been stable since -05
through -10 per the draft's own Appendix G change log: -05 moved the domain
label to the end of the combiner and switched seed-stretching to a 96-byte
SHAKE-256 squeeze (G.4, "this does not have any security or performance
effects"); -06→-07 changed only how the spec TEXT requests SHAKE-256 output
(bits vs bytes — 96 bytes either way, no behavior change, G.2); -07 through
-10 changed only ASN.1/PEM/HPKE/TLS codepoint registration text and
implementation-notes prose (G.1-G.3). sphragis's `hybrid::expand` and
`hybrid::combine` match the -10 (current) definitions byte-for-byte, verified
against this repo's own dependency (`ml-kem` 0.3.2's `Seed = Array<u8, U64>`
+ `DecapsulationKey::from_seed` splitting d||z per FIPS 203
KeyGen_internal(d, z)) and against the published KAT (see xwing-kat-0 below).
Re-verify this stability claim before binding to any future revision beyond
-10 — do not assume it continues to hold.
"""

[[standard]]
id = "ml-kem-768"
name = "ML-KEM-768"
revision = "FIPS 203 (2024-08-13, NIST FIPS PUB 203, final)"
source_url = "https://csrc.nist.gov/pubs/fips/203/final"

[[standard]]
id = "x25519"
name = "X25519 (Curve25519 ECDH)"
revision = "RFC 7748"
source_url = "https://www.rfc-editor.org/rfc/rfc7748"

[[standard]]
id = "hkdf-sha256"
name = "HKDF-SHA256"
revision = "RFC 5869"
source_url = "https://www.rfc-editor.org/rfc/rfc5869"

[[standard]]
id = "chacha20poly1305"
name = "ChaCha20-Poly1305 AEAD"
revision = "RFC 8439"
source_url = "https://www.rfc-editor.org/rfc/rfc8439"

# ---------------------------------------------------------------------------
# Vectors. Every entry here MUST have a corresponding executed assertion,
# named in that entry's own `executed_by` field — almost all live in
# tests/known_answer_vectors.rs; xwing-kat-0 lives in src/hybrid.rs's own
# #[cfg(test)] mod tests instead, because it drives deterministic
# encapsulation, a private method (forkwright/sphragis#17) that only the
# crate's own test build can name. Vendored vectors are committed verbatim,
# byte-for-byte, from the cited upstream commit — never hand-trimmed or
# re-typed — so `source_sha256` is checkable both against the vendored file
# on disk (tests/provenance_lock.rs does this) and against a fresh fetch of
# `origin_url` at any time.
# ---------------------------------------------------------------------------

[[vector]]
id = "xwing-kat-0"
standard = "x-wing"
origin_url = "https://github.com/dconnolly/draft-connolly-cfrg-xwing-kem/blob/main/spec/test-vectors.json"
vendored_from = "https://github.com/RustCrypto/KEMs/blob/bd482f292dedc95002eca3aa35e26222f0cb1064/x-wing/tests/test-vectors.json"
vendored_file = "tests/vectors/xwing-draft-connolly-test-vectors.json"
source_sha256 = "a8726596f4c7629590f727b1bbeb483f6932292fbf5fd85c9cbb803190014f00"
executed_by = "src/hybrid.rs::tests::deterministic_encapsulate_reproduces_xwing_draft_kat"
asserts = ["seed -> decapsulation key (sk)", "encapsulation key (pk)", "ciphertext (ct)", "shared secret (ss), send and receive side"]

[[vector]]
