# ---------------------------------------------------------------------------
# Dependencies. `locked_version` is the version every vector above was
# verified against; tests/provenance_lock.rs asserts it against the version
# Cargo.lock actually resolves. A `cargo update` that moves any of these
# without a corresponding vector re-verification fails the gate.
# ---------------------------------------------------------------------------

