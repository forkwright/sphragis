# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

[advisories]
# WHY: single source of truth for advisory ignores (parity-derived to .cargo/audit.toml + osv-scanner.toml). Empty = no suppressions.
ignore = []
# NOTE: no ignores. A future suppression lands here as [[advisories.ignore]]
# with id + reason + review-by, per SUPPLY-CHAIN.md (kanon crates/basanos/standards).

[licenses]
# WHY: PolyForm Noncommercial covers sphragis itself; every other allowance is
# encountered in the all-features resolved dependency graph.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Unicode-3.0",
    "LicenseRef-PolyForm-Noncommercial-1.0.0",
]
confidence-threshold = 0.8
# WHY: cargo-deny 0.20.2 defaults unused allowances to warnings, which lets a
# stale allowance silently broaden policy. Promote them to errors so CI fails.
unused-allowed-license = "deny"

[bans]
# WHY: rand_core 0.6 (this crate's own injectable-entropy seams) and 0.10
# (ml-kem + x25519-dalek, both transitive) coexist by design; see DECISION.md
# section 6.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
