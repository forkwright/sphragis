# WHY(kanon#2522): replaces the org-default trailer-only reusable
# (forkwright/.github/.github/workflows/gate-attestation.yml@5be130b, job id
# `gate`, required context "gate / gate-attestation") with the kanon-designed
# hybrid gate. A trailer-stamped PR still takes the fast path; a
# trailer-less PR now falls through to a REAL fmt/check/clippy/nextest
# build on GH-hosted ubuntu-latest, which the old org-default never ran.
#
# WHY hosted in forkwright/.github, not forkwright/kanon: GitHub cannot
# resolve a workflow_call reference into a private repo owned by a personal
# account for other-repo callers -- this adoption originally pointed at
# kanon and failed to even schedule the workflow (no run appeared at all)
# before being repointed at the public .github host, which already serves
# the org-default trailer-only reusable to 8 repos successfully (including
# this repo's own prior gate-attestation.yml).
#
# WHY ai_attribution_check/docs_only_exemption ARE set below: the extended
# hybrid-gate.yml (declaring both workflow_call inputs) is now live at
# forkwright/.github. No inline ai-attribution logic exists anywhere in
# this repo's workflows today, so this is a net-new check, not the
# retirement of an existing pattern.
#
# WHY these with: values (cite): .github/workflows/ci.yml (fmt/check/clippy/
# test jobs) + .kanon-ci.toml (forge pipeline, same commands +jobs 8 which we
# drop — GH-hosted ubuntu-latest runners are already core-capped, the 8-job
# ceiling in .kanon-ci.toml exists only to protect menos from concurrent-
# build OOM per that file's own WHY comment, not applicable here).
#
# DISCREPANCY: sphragis is a single [package], not a [workspace] — no
# --workspace flag on any stage. ci.yml runs check/clippy/test for default,
# preview-pq, and preview-pq+hazmat; hybrid-gate.yml's inputs are single
# strings, so all three feature profiles are chained with `&&` below.
#
# WHY nextest + doctest: the reusable gate's test stage uses cargo-nextest,
# while ci.yml and .kanon-ci.toml use cargo test. Because nextest does not run
# doctests, doctest_cmd explicitly covers all three feature profiles too.
#
# rust_toolchain is left unset (empty-string default) so hybrid-gate.yml's
# actions-rust-lang/setup-rust-toolchain step auto-detects from this repo's
# own rust-toolchain.toml, per the fleet convention the input's own
# description names (forkwright/harmonia CLAUDE.md: "Toolchain comes from
# rust-toolchain.toml, never workflow inputs"). An explicit "stable" here
# previously overrode that pin — the setup action only auto-detects when the
# `toolchain:` input is the empty string, so any non-empty value bypasses the
# repo's pinned channel entirely, which is the one thing this input exists to
# prevent for a repo that already carries its own toolchain file.
#
# DOUBLE-BUILD-COST FLAG: ci.yml (fmt/check/clippy/test, on: pull_request +
# push:main) is NOT currently in branch-protection required_status_checks
# (only "gate / gate", "cargo deny", "cargo audit" are) — so this
# is a CI-MINUTES duplication, not a merge-latency one: once full-gate-build
# also runs these commands for trailer-less PRs, every PR still pays ci.yml's
# build cost a second time regardless of trailer state. Recommend leaving
# ci.yml as-is (informational, non-required) unless CI-minute spend becomes
# a concern.
#
# NOTE: sphragis#10 (toolchain-pin PR) independently fails `cargo audit`
# today, unrelated to this gate migration — needs its own fix regardless.
name: Gate Attestation

on:
  pull_request:
    branches: [main]
  # WHY a push trigger and not just pull_request: a squash merge does not
  # carry the source commits' trailers, so no commit on main has a
  # Gate-Passed trailer -- check-trailer finds none and routes to
  # full-gate-build, which is the job that actually compiles the workspace.
  # Without this nothing ever builds main, and the first PR to inherit a
  # merged break is what discovers it (forkwright/theatron#235).
  push:
    branches: [main]

permissions:
  contents: read

# WHY no concurrency: block here: hybrid-gate.yml itself already declares
# `concurrency: group: ${{ github.workflow }}-${{ github.ref }}` and its own
# comment states callers must NOT also set a concurrency group with that
# same key, or the shared group self-cancels. sphragis's PRIOR file set this
# exact key -- dropped here, not carried forward, for that reason.

jobs:
  gate:
    # WHY @main, not a pinned SHA: forkwright/.github publishes no tags, so a
    # SHA pin here has no dependabot bump path and just freezes. forkwright/
    # .github is first-party -- same org, same trust boundary -- not the
    # third-party supply-chain case a SHA pin defends against. A floating ref
    # can't go stale.
    uses: forkwright/.github/.github/workflows/hybrid-gate.yml@main
    with:
      fmt_cmd: "cargo fmt --all -- --check"
      check_cmd: "cargo check --all-targets && cargo check --all-targets --features preview-pq && cargo check --all-targets --features preview-pq,hazmat"
      clippy_cmd: "cargo clippy --all-targets -- -D warnings && cargo clippy --all-targets --features preview-pq -- -D warnings && cargo clippy --all-targets --features preview-pq,hazmat -- -D warnings"
      nextest_cmd: "cargo nextest run && cargo nextest run --features preview-pq && cargo nextest run --features preview-pq,hazmat"
      doctest_cmd: "cargo test --doc && cargo test --doc --features preview-pq && cargo test --doc --features preview-pq,hazmat"
      system_packages: ""
      needs_fleet_repo_token: false
      rust_cache_key: "gate-attestation"
      ai_attribution_check: true
      # WHY(sphragis#43): CI topology and review-status prose are security
      # boundaries, so docs-only changes must exercise the fitness test.
      docs_only_exemption: false
    secrets: inherit
