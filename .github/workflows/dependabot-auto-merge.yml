name: Dependabot Auto-Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependabot-auto-merge:
    # WHY @main, not a pinned SHA: forkwright/.github publishes no tags, so a
    # SHA pin here has no dependabot bump path and just freezes -- a pin that
    # looks maintained but silently never moves. forkwright/.github is
    # first-party -- same org, same trust boundary -- not the third-party
    # supply-chain case a SHA pin defends against. Fleet convention: triggers,
    # permissions and inputs live in the caller, logic is delegated, callers
    # pin @main.
    uses: forkwright/.github/.github/workflows/dependabot-auto-merge.yml@main
