[package]
name = "sphragis"
description = "σφραγίς — post-quantum hybrid sealing (X-Wing KEM + ChaCha20-Poly1305 envelope)"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/forkwright/sphragis"
documentation = "https://docs.rs/sphragis"
keywords = ["cryptography", "post-quantum", "x-wing", "ml-kem", "hybrid-kem"]
categories = ["cryptography", "no-std"]
readme = "README.md"

[features]
default = []
# WHY: unaudited hybrid post-quantum cryptography. Never in the default binary
# path. Gated until cryptographic review per akroasis#131 done-criterion 6.
preview-pq = [
    "dep:ml-kem",
    "dep:x25519-dalek",
    "dep:sha3",
    "dep:sha2",
    "dep:hkdf",
    "dep:chacha20poly1305",
    "dep:rand_core",
    "dep:subtle",
]
# WHY(sphragis#23): reachability, not a dependency set — no crypto deps of its
# own. Ships the generic X-Wing/ML-KEM primitive surface (HybridKem, raw
# SharedSecret, direct encaps/decaps, derive_wrap_key) for known-answer-vector
# and conformance testing only. No stability promise. A normal consumer never
# enables this: `generate_recipient_keypair`/`seal_for`/`unseal` are the
# stable envelope-profile entry points and need no hazmat access.
hazmat = ["preview-pq"]

[dependencies]
snafu = "0.8"
zeroize = { version = "1", features = ["derive"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
# WHY: gives the CBOR byte-blob fields (kem_ciphertext, recipient_id,
# aead_nonce, sealed_key) a compact byte-string wire encoding whose
# deserialize path grows its buffer only as bytes are actually read from the
# input, instead of serde's generic `Vec<T>`/array-of-elements path, which
# pre-allocates off an attacker-declared element count (bounded but still an
# amplification). See src/seal.rs `WrappedContentKey`.
serde_bytes = "0.11"
# WHY: sha3 0.11 (ml-kem's own digest generation) — its `zeroize` feature wipes
# hasher + XOF-reader state on drop; 0.10 offers no digest-state zeroization.
sha3 = { version = "0.11", features = ["zeroize"], optional = true }
# WHY: sha2 0.11 `zeroize` wipes Sha256 core state + block buffers on drop
# (digest 0.11 generation, shared with sha3 0.11 / ml-kem); hkdf 0.13 + its
# hmac 0.13 drop-cascade through those impls, so the HKDF PRK-keyed HMAC state
# is wiped when `Hkdf` drops. hkdf has no zeroize feature of its own — the
# leaf `Drop` impls are the mechanism.
sha2 = { version = "0.11", features = ["zeroize"], optional = true }
hkdf = { version = "0.13", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
# WHY: "std" (not just "getrandom") so `rand_core::Error` implements
# `std::error::Error` and can sit behind `SealError::Entropy`'s `source` field
# — without it, `Error` is the no_std variant (a bare error code, no source
# chain) and `.context(EntropySnafu)` does not compile.
rand_core = { version = "0.6", features = ["getrandom", "std"], optional = true }
# WHY: `rotate::PendingRotation::begin` is this crate's first *direct*
# secret-vs-secret comparison (the new epoch's content key against the one
# it replaces) -- every prior comparison either operates on public data
# (RecipientId) or lives inside chacha20poly1305's own Poly1305 tag check,
# which already depends on `subtle` transitively (see DECISION.md #6). A
# variable-time `==` on two content keys would leak where they agree
# through timing, so the comparison needs `subtle::ConstantTimeEq`
# explicitly rather than relying on the transitive copy.
subtle = { version = "2", optional = true }

# Post-quantum hybrid KEM stack (preview-pq only).
# WHY: released RustCrypto primitives, not the rc-pinned `x-wing` aggregate crate.
[dependencies.ml-kem]
version = "0.3.2"
features = ["hazmat", "zeroize"]
optional = true

[dependencies.x25519-dalek]
version = "2.0.1"
features = ["static_secrets", "zeroize"]
optional = true

[dev-dependencies]
hex-literal = "0.4"
# WHY: tests/inert_default.rs parses this manifest to lock the packaging
# invariant (default feature set empty, all crypto deps optional).
toml = "0.8"
hkdf = { version = "0.13" }
sha2 = { version = "0.11" }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
# WHY: decoder property coverage for WrappedContentKey::from_cbor per the
# fleet parser/decoder testing standard; proptest-regressions/ is tracked.
proptest = "1"
# WHY: reads the vendored ACVP / X-Wing-draft vector JSON directly at test
# time (tests/vectors/*.json) instead of duplicating their fields as a second,
# hand-copied set of hex literals that could silently desync from the
# hash-locked file (crypto-provenance.toml, tests/provenance_lock.rs).
serde_json = "1"
hex = "0.4"
# WHY: tests/entropy_failure.rs implements a mock RngCore to inject an
# on-demand entropy failure into the `_with_rng` seams (#16).
rand_core = { version = "0.6", features = ["getrandom"] }

# WHY(sphragis#23): the KAT gate calls the hazmat-only primitive surface
# directly (HybridKem, derive_wrap_key, direct encaps/decaps) to prove the
# construction against published vectors — declaring that requirement here
# means `cargo test --features preview-pq` (no hazmat) skips this target
# instead of failing to compile it, and `--features preview-pq,hazmat` runs
# it.
[[test]]
name = "known_answer_vectors"
required-features = ["preview-pq", "hazmat"]

# WHY(sphragis#16, sphragis#23): proves the injectable-RNG entropy-failure
# path on the hazmat-only primitive surface directly (`HybridKem::
# generate_with_rng`, `EncapsulationKey::encapsulate_with_rng`) — the same
# reachability reasoning as `known_answer_vectors` above. The runtime logic
# under test is identical regardless of `hazmat` (the feature only toggles
# `pub` vs `pub(crate)` on the seam, never its body), so gating this target
# does not narrow what behavior CI's `preview-pq,hazmat` job actually
# exercises.
[[test]]
name = "entropy_failure"
required-features = ["preview-pq", "hazmat"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
redundant_pub_crate = "allow"
